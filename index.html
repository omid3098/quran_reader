<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Quran Reader</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Amiri", "serif"],
              vazir: ["Vazirmatn", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Vazirmatn:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-quran {
        font-family: "Vazirmatn", sans-serif;
        line-height: 2.8;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      /* Custom Scrollbar */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      .dark .custom-scrollbar {
        scrollbar-color: #334155 transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #334155;
      }

      /* Smooth scrolling for the html element */
      html {
        scroll-behavior: smooth;
      }

      /* Force Vazirmatn font on BlockNote editor */
      .rich-note-editor,
      .rich-note-editor * {
        font-family: "Vazirmatn", sans-serif !important;
      }
      .rich-note-editor [data-content-type="paragraph"],
      .rich-note-editor [data-content-type="heading"],
      .rich-note-editor [data-content-type="bulletListItem"],
      .rich-note-editor [data-content-type="numberedListItem"] {
        font-family: "Vazirmatn", sans-serif !important;
      }
      /* Make BlockNote editor background transparent to match modal */
      .rich-note-editor .bn-editor,
      .rich-note-editor .bn-container,
      .rich-note-editor .mantine-Paper-root {
        background: transparent !important;
        background-color: transparent !important;
      }
      /* Style links in BlockNote editor */
      .rich-note-editor a {
        color: #2563eb; /* blue-600 */
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 0.15s;
      }
      .rich-note-editor a:hover {
        color: #1d4ed8; /* blue-700 */
      }
      .dark .rich-note-editor a {
        color: #60a5fa; /* blue-400 */
      }
      .dark .rich-note-editor a:hover {
        color: #93c5fd; /* blue-300 */
      }
      /* ReactFlow dark mode overrides */
      .dark .react-flow__background {
        background-color: rgb(2, 6, 23) !important; /* slate-950 */
      }
      .dark .react-flow__controls button {
        background: rgb(30, 41, 59);
        fill: rgb(148, 163, 184);
        border-color: rgb(51, 65, 85);
      }
      .dark .react-flow__controls button:hover {
        background: rgb(51, 65, 85);
      }
      .dark .react-flow__edge-path {
        stroke: rgb(100, 116, 139);
      }
      .react-flow__handle {
        opacity: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
        }
      }
    </script>
  </head>
  <body
    class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-200 selection:text-emerald-900 dark:selection:bg-emerald-900 dark:selection:text-emerald-100"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
