name: Deploy Beta
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run prebuild
      - run: NEXT_PUBLIC_BASE_PATH=/quran_reader/beta pnpm --filter web build
      - name: Deploy to gh-pages/beta
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/web/out
          destination_dir: beta
          keep_files: true
          commit_message: "Deploy beta: ${{ github.sha }}"
