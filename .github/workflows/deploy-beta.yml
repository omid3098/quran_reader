name: Deploy Beta
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run prebuild
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_BASE_PATH: /quran_reader/beta
          BASE_PATH: /quran_reader/beta
      - name: Debug out directory
        run: |
          echo "Listing apps/web/out:" && ls -lah apps/web/out || true
          echo "Listing top-level entries:" && (ls -1 apps/web/out | sed -n '1,100p' || true)
          if [ ! -f apps/web/out/index.html ]; then
            echo "ERROR: apps/web/out/index.html is missing" >&2
            exit 1
          fi
      - name: Deploy to gh-pages/beta
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/web/out
          destination_dir: quran_reader/beta
          keep_files: true
          commit_message: "Deploy beta: ${{ github.sha }}"
