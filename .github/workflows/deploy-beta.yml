name: Deploy Beta
on:
  push:
    branches: [beta]
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run prebuild
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_BASE_PATH: /quran_reader/beta
          BASE_PATH: /quran_reader/beta
      - name: Add .nojekyll file for beta
        run: touch apps/web/out/.nojekyll

      - name: Deploy to gh-pages beta folder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/web/out
          destination_dir: quran_reader/beta
          keep_files: false
          commit_message: "Deploy beta: ${{ github.sha }}"
