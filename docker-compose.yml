services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oqr
      POSTGRES_PASSWORD: oqr
      POSTGRES_DB: oqr
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
volumes:
  db_data:

